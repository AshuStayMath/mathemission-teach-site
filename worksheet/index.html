<style>
/* ---------- builder (screen) ---------- */
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:20px 0 4px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.sec-h h3{font-size:16px}.sec-h span{font-size:12px;color:var(--muted)}
.q .qn{color:var(--cyan);font-weight:700;margin-right:6px}
.saved li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);list-style:none}
.saved ul{padding:0}
.lockt{font-size:11px;color:var(--gold);border:1px solid #f5c54266;border-radius:999px;padding:1px 7px;margin-left:6px}
.srcgrid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.srcb{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
.srcb .tk{flex:none;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;margin-top:1px}
.srcb b{display:block;font-size:14px}.srcb small{color:var(--muted);font-size:12px}
.srcb.on{border-color:#3a5aa8;background:#14245a}.srcb.on .tk{background:#2f6fe4;border-color:#2f6fe4;color:#fff}
.srcb.lock{opacity:.55}
.mini{font-size:12px;color:var(--muted)}
.chipbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0}
.chipbar button{font-size:12px;color:var(--cyan)}

/* ---------- the printed sheet (also used for the on-screen preview) ---------- */
#sheet{display:none}
#pvwrap{position:fixed;inset:0;z-index:60;background:#0b1020e8;overflow:auto;padding:70px 12px 40px}
#pvwrap .pbar{position:fixed;top:0;left:0;right:0;z-index:61;display:flex;gap:8px;justify-content:center;align-items:center;padding:12px;background:#060b1f;border-bottom:1px solid var(--line)}
#pvwrap .pbar span{color:var(--muted);font-size:13px;margin-right:auto;padding-left:6px}
#pvwrap #sheet{display:block;margin:0 auto;width:210mm}
#pvwrap #sheet .set{background:#fff;box-shadow:0 6px 30px #0008;padding:15mm 14mm 16mm;margin:0 auto 18px;min-height:250mm}
#sheet{--ink:#14182b;--navy:#0b1f4d;--blue:#1d4fc4;--rule:#c9d3ea;--tint:#f2f6fd;--gold:#b7860b;
  color:var(--ink);font:10.6pt/1.5 "Source Serif 4","Latin Modern Roman",Georgia,serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#sheet *{box-sizing:border-box}
#sheet .sans{font-family:Inter,system-ui,sans-serif}
/* header */
#sheet .mast{display:flex;align-items:center;gap:12px;padding-bottom:9px;border-bottom:2.2px solid var(--navy);position:relative}
#sheet .mast::after{content:"";position:absolute;left:0;bottom:-5px;width:46mm;height:2px;background:var(--gold)}
#sheet .mast img{width:13mm;height:13mm;border-radius:3mm;flex:none}
#sheet .mast img.own{width:auto;height:auto;max-height:15mm;max-width:45mm;border-radius:0;object-fit:contain}
#sheet .mast .who{flex:1;min-width:0}
#sheet .mast .inst{font:800 15.5pt/1.15 Inter,sans-serif;color:var(--navy);letter-spacing:.01em}
#sheet .mast .sub{font:600 8.4pt/1.3 Inter,sans-serif;color:#5a6788;letter-spacing:.14em;text-transform:uppercase;margin-top:2px}
#sheet .mast .setb{flex:none;text-align:center;border:1.6px solid var(--navy);border-radius:2.5mm;padding:1.5mm 3.5mm;font:800 8pt/1.1 Inter,sans-serif;color:var(--navy);letter-spacing:.12em}
#sheet .mast .setb b{display:block;font-size:17pt;letter-spacing:0;margin-top:1px}
#sheet .title{font:700 13.2pt/1.25 Inter,sans-serif;color:var(--ink);margin:12px 0 7px}
#sheet .facts{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--rule);border-radius:2mm;overflow:hidden}
#sheet .facts div{padding:1.6mm 3mm;border-right:1px solid var(--rule);font:500 9pt/1.25 Inter,sans-serif}
#sheet .facts div:last-child{border-right:none}
#sheet .facts small{display:block;font-size:6.8pt;letter-spacing:.14em;text-transform:uppercase;color:#6b7799;font-weight:700;margin-bottom:1px}
#sheet .cand{display:grid;grid-template-columns:2.2fr 1fr .8fr;gap:5mm;margin:5mm 0 4mm;font:500 9pt Inter,sans-serif;color:#4a5677}
#sheet .cand span{border-bottom:1px solid #8c97b5;padding-bottom:1mm}
#sheet .ins{background:var(--tint);border-left:2.6px solid var(--navy);border-radius:0 2mm 2mm 0;padding:2.4mm 4mm;margin:0 0 5mm;font:9pt/1.45 Inter,sans-serif;color:#2b3554}
#sheet .ins h5{font:800 7.4pt Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--navy);margin:0 0 1.2mm}
#sheet .ins ul{margin:0;padding-left:4.2mm}#sheet .ins li{margin:.4mm 0}
/* sections */
#sheet .secbar{display:flex;align-items:center;gap:3mm;margin:6mm 0 3.4mm;break-after:avoid}
#sheet .secbar .tag{background:var(--navy);color:#fff;font:800 7.6pt Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;padding:1.3mm 3mm;border-radius:1.4mm}
#sheet .secbar .nm{font:700 10.5pt Inter,sans-serif;color:var(--navy)}
#sheet .secbar .ln{flex:1;height:1px;background:var(--rule)}
#sheet .secbar .mk{font:600 8.4pt Inter,sans-serif;color:#4a5677;white-space:nowrap}
#sheet .cols{column-count:2;column-gap:9mm;column-rule:1px solid var(--rule)}
/* questions */
#sheet .pq{display:flex;align-items:baseline;gap:2mm;break-inside:avoid;margin:0 0 4.6mm}
#sheet .pq .n{flex:none;width:6.5mm;text-align:right;font:700 10.6pt/1.5 Inter,sans-serif;color:var(--blue);font-variant-numeric:tabular-nums}
#sheet .pq .n::after{content:"."}
#sheet .pq .b{flex:1;min-width:0}
#sheet .pq .qsrc{font:600 7.2pt Inter,sans-serif;color:#7a86a6;letter-spacing:.04em;margin:-.4mm 0 1mm}
#sheet .stem p{margin:0 0 1.5mm}
#sheet .opts{display:grid;gap:1.2mm 6mm;margin:2mm 0 0;padding:0;list-style:none}
#sheet .opts.c4{grid-template-columns:repeat(4,1fr)}#sheet .opts.c2{grid-template-columns:repeat(2,1fr)}#sheet .opts.c1{grid-template-columns:1fr}
#sheet .opts li{min-width:0;padding-left:7.2mm;text-indent:-7.2mm}
#sheet .opts li>span:last-child{text-indent:0}
#sheet .opts.c4 li>span:last-child,#sheet .opts.c2 li>span:last-child{white-space:nowrap}
#sheet .opts .ol{display:inline-block;width:7.2mm;text-indent:0;font-weight:600;color:var(--navy)}
#sheet .ansbox{display:inline-flex;align-items:center;gap:2mm;margin-top:2mm;font:600 8pt Inter,sans-serif;color:#6b7799}
#sheet .ansbox i{display:inline-block;width:30mm;height:7mm;border:1px solid #9aa5c2;border-radius:1.5mm}
#sheet table{border-collapse:collapse}
#sheet .mgrid td,#sheet .mgrid th{border:1px solid #9aa5c2;padding:1mm 3mm;font-size:9.4pt;min-width:9mm}
#sheet .mgrid th{background:var(--tint)}
#sheet .box{background:var(--tint);border:1px solid var(--rule);border-radius:2mm;padding:2mm 3mm;margin:0 0 2mm;color:var(--ink)}
#sheet .box h3{font:800 7.4pt Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--navy);margin:0 0 1mm}
#sheet .stem,#sheet .tw{overflow:visible!important}
#sheet table{font-size:inherit;margin:1.5mm 0}#sheet td,#sheet th{border:1px solid #9aa5c2;padding:1mm 2.5mm;min-width:0;vertical-align:top;color:var(--ink)}
#sheet .stem ol,#sheet .stem ul{padding-left:6mm;margin:1mm 0}
#sheet mjx-container{max-width:none!important;overflow:visible!important}
#sheet mjx-container[display="true"]{margin:1.6mm 0!important}
#sheet img,#sheet svg:not(mjx-container svg){max-width:100%;height:auto}
#sheet .qmk{float:right;font:700 8.4pt Inter,sans-serif;color:var(--navy);margin-left:3mm}
#sheet .work{height:38mm;border:1px dashed #b9c3dc;border-radius:2mm;margin-top:2.5mm}
#sheet .inkpg{break-inside:avoid;margin:0 0 5mm;text-align:center}
#sheet .inkpg svg{max-width:100%;height:auto}
#sheet .end{text-align:center;font:700 8pt Inter,sans-serif;letter-spacing:.3em;color:#9aa5c2;margin-top:6mm}
/* answer key */
#sheet .keygrid{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--rule);border-radius:2mm;overflow:hidden;margin-top:3mm}
#sheet .keygrid div{display:flex;gap:2.5mm;align-items:baseline;padding:1.6mm 3mm;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);font-size:9.6pt}
#sheet .keygrid b{font:700 8.4pt Inter,sans-serif;color:var(--navy);min-width:6mm}
#sheet .keyset{font:800 8pt Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--navy);margin:6mm 0 0}
/* solutions */
#sheet .sol{break-inside:avoid;margin:0 0 4mm;padding:0 0 3.4mm;border-bottom:1px solid var(--rule)}
#sheet .sol .hd{display:flex;align-items:center;gap:3mm;margin-bottom:1.4mm}
#sheet .sol .chip{font:700 8.2pt Inter,sans-serif;color:var(--navy);background:var(--tint);border:1px solid var(--rule);border-radius:1.4mm;padding:.6mm 2.4mm}
#sheet .sol .lb{font:800 7pt Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--blue);margin:2mm 0 .6mm}
@media print{
  @page{size:A4;margin:14mm 13mm 15mm}
  html,body{background:#fff!important}
  body>*:not(#sheet):not(#pvwrap){display:none!important}
  #pvwrap{position:static;background:none;padding:0;overflow:visible}
  #pvwrap .pbar{display:none}
  #pvwrap #sheet,#sheet{display:block;max-width:none;width:auto}
  #sheet .set,#pvwrap #sheet .set{box-shadow:none;padding:0;margin:0;min-height:0;break-after:page}
  #sheet .set:last-child{break-after:auto}
}
</style>

<body>
<header class="top">
  <a class="tback" href="/" title="Back to Teach" aria-label="Back to Teach">&#8249; Teach</a><a class="brand" href="/"><img class="logo" src="/logo-m-96.png" alt=""><span>Mathemission Teach<small id="sub"></small></span></a>
  <nav class="nav" id="nav"></nav>
  <span id="plan" class="plan hidden"></span>
</header>
<main class="wrap" id="app"><div class="spin">Loading…</div></main>
<footer class="wrap">AK · Stay Mathactive · <a href="https://mathemission.in">mathemission.in</a></footer>
<div id="toast" class="toast hidden"></div>
<div id="sheet"></div>
<script>
(() => {
'use strict';
const K = window.MMK, { esc, toast, typeset } = K;
const app = document.getElementById('app');
K.chrome('Worksheet Builder');

const FREE_MAX = 15, PRO_MAX = 90, FREE_SAVES = 3;
/* Where a question comes from. Institute rows (status 'teach') are readable by Teach Pro and admin only (RLS, migration 35). */
const SRC = {
  main: { name: 'JEE Main PYQs', note: '2019–2026 shifts', years: true },
  adv: { name: 'JEE Advanced PYQs', note: '2006–2026 papers', years: true },
  ra: { name: 'Rankers Assignment Plus', note: 'RA Plus sets' },
  mf: { name: 'MM Fresh Problems', note: "AK's own problems, not from past papers" },
  sc: { name: 'Sri Chaitanya Style · GTA', note: 'Grand-test style', pro: true },
  fj: { name: 'FIITJEE Style · AITS', note: 'All India Test Series style', pro: true },
  nn: { name: 'Narayana Style · GTA', note: 'Grand-test style', pro: true },
  al: { name: 'ALLEN Style · Test Series', note: 'Leader test style', pro: true },
  cp: { name: 'MM Practice Sets', note: 'Curated chapter-wise practice · checked by AK', pro: true },
  my: { name: 'My Questions', note: 'written by me' },
};
/* Source cards (AK, 24 Nov): exact counts only for PYQs (official, complete papers) and My Questions (the teacher's own).
   Other banks show what they are; the live count per type is in "How many of each type". */
function srcNote(s, n) {
  if (s === 'my') return `${SRC.my.note} · ${n.toLocaleString()} question${n === 1 ? '' : 's'}`;
  if (SRC[s].years) return `${SRC[s].note} · ${n.toLocaleString()} questions`;
  return SRC[s].note;
}
const ADV_SRCS = ['adv', 'ra', 'mf', 'sc', 'fj', 'nn', 'al', 'cp', 'my'];
const MAIN_SRCS = ['main', 'mf', 'cp', 'my'];
function srcOf(q) {
  if (q.my) return 'my';
  if (q.page) return 'page';
  if (/^MF-/.test(q.id)) return 'mf';
  if (/^(CP|BN)-/.test(q.id)) return 'cp';
  if (/^AL-/.test(q.id)) return 'al';
  if (q.track === 'main') return 'main';
  if (K.isRA(q)) return 'ra';
  const m = /^(SC|FJ|NN)-/.exec(q.id);
  return m ? m[1].toLowerCase() : 'adv';
}
const BUCKETS = {
  main: [['sc', 'MCQ', 4, -1], ['num', 'Numerical', 4, -1], ['subj', 'Subjective', 0, 0], ['page', 'Handwritten pages', 0, 0]],
  adv: [['sc', 'Single correct', 3, -1], ['mc', 'Multiple correct', 4, -2], ['num', 'Numerical', 4, 0], ['match', 'Matching', 3, -1], ['subj', 'Subjective', 0, 0], ['page', 'Handwritten pages', 0, 0]]
};
const FORM_BUCKETS = t => BUCKETS[t].filter(([b]) => b !== 'page');
const DIFF = { any: null, easy: [.5, .4, .1], balanced: [.3, .5, .2], hard: [.1, .4, .5] };
const DNAME = ['Easy', 'Moderate', 'Difficult'];

let CH = [], META = [], FULL = {}, SAVED = [], PREFS = {}, MYQ = {};
/* Sheet logo (Teach Pro): { mode: 'mm' | 'own' | 'none', img: data URL }. Its own user_kv key so prefs stay small. */
let LOGO = { mode: 'mm', img: '' };
const CONC = {};   // concept id -> {topic, name, ord}
const hasConc = (q, list) => (q.concepts || []).some(c => list.includes(c));
const W = {
  id: null, title: '', track: 'adv', srcs: ['adv'], chapters: [], concepts: [], yFrom: 2006, yTo: 2026, diff: 'balanced', order: 'easy', avoid: true, mix: true,
  counts: { main: { sc: 20, num: 5, subj: 0 }, adv: { sc: 4, mc: 4, num: 4, match: 0, subj: 0 } }, marking: true,
  sets: 1, key: true, sols: false, cols: false, showSrc: false, answerBoxes: true, minutes: 0, items: []
};
const track = () => W.track;
const bucketOf = q => { if (q.page) return 'page'; const k = K.kind(q); if (k === 'subj') return 'subj'; if (q.track === 'main') return k === 'sc' ? 'sc' : 'num'; if (q.qtype === 'MATCH' || k === 'grid') return 'match'; return k; };
const diffIx = q => Math.max(0, DNAME.indexOf(q.difficulty || 'Moderate'));
const chName = id => (CH.find(c => c.id === id) || {}).name || '';
/* "Also covers": a question counts for a chapter if it is its main chapter or one it also covers (My Questions). */
const inChaps = (q, list) => list.includes(q.chapter_id) || (q.also || []).some(a => list.includes(a));
const coversCh = (q, id) => q.chapter_id === id || (q.also || []).includes(id);
function alsoTag(q) {
  const a = (q.also || []).filter(x => W.chapters.includes(x));
  return W.chapters.length && !W.chapters.includes(q.chapter_id) && a.length ? ` <em class="alsot" title="Main chapter: ${esc(chName(q.chapter_id))}">also ${esc(chName(a[0]))}</em>` : '';
}
const chOrder = id => (CH.find(c => c.id === id) || {}).syllabus_order || 0;
const srcList = () => (W.track === 'main' ? MAIN_SRCS : ADV_SRCS).filter(s => !SRC[s].pro || K.pro()).filter(s => META.some(q => q.track === W.track && srcOf(q) === s));
const srcNames = () => [...new Set([...W.srcs, ...W.items.map(id => qOf(id) && srcOf(qOf(id)))])].filter(s => SRC[s]).map(s => SRC[s].name).join(' + ') || 'My worksheet';

const INTRO = `<h1><small>Mathemission Teach</small>Worksheet &amp; Test Builder</h1>
  <p class="lead">Pick chapters, sources and how many questions. Teach chooses verified questions, balances the difficulty and makes a print-ready sheet in your name, with the answer key.</p>`;

(async () => {
  if (!await K.boot(app, INTRO)) return;
  app.innerHTML = INTRO + '<div class="spin" id="ld">Loading the question bank…</div>';
  try {
    [CH, META, SAVED, PREFS] = await Promise.all([
      K.chapters(),
      K.fetchAll('questions', 'id,track,chapter_id,year,paper,qtype,passage_id,answer_key,difficulty,concepts', q => q.eq('status', 'published').order('id'),
        n => { const l = document.getElementById('ld'); if (l) l.textContent = `Loading the question bank… ${n}`; })
        .then(async rows => K.pro() ? rows.concat(await K.fetchAll('questions', 'id,track,chapter_id,year,paper,qtype,passage_id,answer_key,difficulty,source_ref,concepts',
          q => q.eq('status', 'teach').order('id'))) : rows),
      K.kvGet('teach_worksheets', []),
      K.kvGet('teach_sheet_prefs', {}),
      K.kvGet('teach_sheet_logo', null).then(l => { if (l && l.mode) LOGO = l; }),
      K.myQuestions().then(m => { MYQ = m; }),
      K.sb.from('concept_list').select('id,topic,name,ord').then(r => { (r.data || []).forEach(c => { CONC[c.id] = c; }); })
    ]);
  } catch (e) { app.innerHTML = INTRO + `<div class="lock"><h3>Couldn’t load the question bank</h3><p>${esc(e.message)}</p></div>`; return; }
  META = META.filter(q => !q.passage_id && q.answer_key);   // paragraph sets stay out of worksheets for now
  Object.values(MYQ).filter(r => r && !r.deleted && r.stem).forEach(r => { const q = K.myToQ(r); META.push(q); FULL[q.id] = q; });
  W.inst = PREFS.inst || ''; W.teacher = PREFS.teacher || ''; W.batch = PREFS.batch || '';
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('track') === 'main') setTrack('main');
  if (h.get('chapter')) W.chapters = [+h.get('chapter')];
  if (h.get('set')) { if (await fromSet(h.get('set'))) return; }
  if (h.get('my')) { if (fromMine(h.get('my').split(','))) return; }
  if (h.has('resume')) { if (resumeDraft(h.get('add'))) return; }
  form();
})();

/* A worksheet from questions picked on My Questions (/my/ → tick → "Make a worksheet"). */
function fromMine(ids) {
  const items = ids.map(x => 'MY-' + x).filter(x => FULL[x]);
  if (!items.length) { toast('Those questions were not found.'); return false; }
  W.track = items.filter(x => FULL[x].track === 'main').length > items.length / 2 ? 'main' : 'adv';
  W.srcs = ['my']; W.items = items.slice(0, K.pro() ? PRO_MAX : FREE_MAX); W.title = W.title || 'My worksheet'; W.id = null; W.minutes = 0;
  history.replaceState(null, '', location.pathname);
  sheet();
  return true;
}
/* The sheet being built is kept for this browser tab, so "Write a new question" can come back to it. */

async function fromSet(id) {

/* ---------------- choosing the questions ---------------- */
/* Fill n slots: follow the difficulty mix, spread over chapters, and (when mixing) over sources too. */
function pick(cands, n, taken) {
  const out = [], perCh = {}, perSrc = {};
  let left = K.shuffle(cands.filter(q => !taken.has(q.id)));
  const mix = DIFF[W.diff];
  const want = mix ? mix.map(x => x * n) : null;
  const got = [0, 0, 0];
  const mixSrc = W.mix && W.srcs.length > 1;
  while (out.length < n && left.length) {
    let d = -1;
    if (want) { let best = -1e9; for (let i = 0; i < 3; i++) { const need = want[i] - got[i]; if (need > best && left.some(q => diffIx(q) === i)) { best = need; d = i; } } }
    let c = d < 0 ? left : left.filter(q => diffIx(q) === d);
    if (mixSrc) { const lowS = Math.min(...c.map(q => perSrc[srcOf(q)] || 0)); c = c.filter(q => (perSrc[srcOf(q)] || 0) === lowS); }
    const low = Math.min(...c.map(q => perCh[q.chapter_id] || 0));
    const q = c.find(q => (perCh[q.chapter_id] || 0) === low);
    out.push(q); taken.add(q.id); got[diffIx(q)]++;
    perCh[q.chapter_id] = (perCh[q.chapter_id] || 0) + 1; perSrc[srcOf(q)] = (perSrc[srcOf(q)] || 0) + 1;
    left = left.filter(x => x !== q);
  }
  return out;
}
function arrange(list) {
  if (W.order === 'easy') return list.slice().sort((a, b) => diffIx(a) - diffIx(b) || chOrder(a.chapter_id) - chOrder(b.chapter_id));
  if (W.order === 'chapter') return list.slice().sort((a, b) => chOrder(a.chapter_id) - chOrder(b.chapter_id) || diffIx(a) - diffIx(b) || (a.year || 0) - (b.year || 0));
  return list;
}
function build() {
  const p = pool(), used = W.avoid ? usedIds() : new Set(), taken = new Set(used);
  const items = [], short = [];
  for (const [b, name] of FORM_BUCKETS(track())) {
    const n = +W.counts[track()][b] || 0; if (!n) continue;
    const got = arrange(pick(p.filter(q => bucketOf(q) === b), n, taken));
    if (got.length < n) short.push(`${name}: ${got.length} of ${n}`);
    items.push(...got.map(q => q.id));
  }
  if (!items.length) return toast('No questions match. Add sources or chapters, or widen the years.');
  W.items = items;
  if (!W.title) W.title = defaultTitle();
  if (short.length) toast('Not enough questions for ' + short.join(', '));
  sheet();
}
function defaultTitle() {
  const names = W.chapters.map(chName);
  const what = names.length === 0 ? 'Mixed chapters' : names.length <= 2 ? names.join(' & ') : `${names[0]} + ${names.length - 1} more`;
  return `${what} · ${track() === 'main' ? 'JEE Main' : 'JEE Advanced'} practice`;
}

async function ensureFull(ids) {
  ids.filter(id => /^INK-/.test(id) && !FULL[id]).forEach(id => { FULL[id] = pageItem(id); });
  const need = ids.filter(id => !FULL[id] && !/^(MY|INK)-/.test(id));
  if (!need.length) return;
  const rows = await K.fetchIn('questions', 'id,track,chapter_id,year,paper,qtype,passage_id,stem_html,options,answer_key,difficulty,source_ref', 'id', need);
  rows.forEach(r => FULL[r.id] = r);
}
const qOf = id => FULL[id] || META.find(q => q.id === id);
function sections(ids) {
  return BUCKETS[track()].map(([b, name, plus, minus]) => ({ b, name, plus, minus, ids: ids.filter(id => bucketOf(qOf(id)) === b) })).filter(s => s.ids.length);
}
function maxMarks(ids) {
  return sections(ids).reduce((m, s) => m + s.ids.reduce((a, id) => { const q = qOf(id); return a + (q.page ? 0 : K.kind(q) === 'subj' ? (+q.marks || 0) : K.kind(q) === 'grid' ? 2 * (q.options.rows || []).length : s.plus); }, 0), 0);
}

/* Trim white / transparent edges, then shrink to at most 480 × 200 px. PNG keeps transparency; photos become JPEG. */
function shrinkLogo(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('bad image')); };
    im.onload = () => {
      URL.revokeObjectURL(url);
      const s0 = Math.min(1, 1600 / Math.max(im.width, im.height));
      const c = document.createElement('canvas'); c.width = Math.round(im.width * s0); c.height = Math.round(im.height * s0);
      const x = c.getContext('2d'); x.drawImage(im, 0, 0, c.width, c.height);
      const d = x.getImageData(0, 0, c.width, c.height).data;
      let alpha = false, t = c.height, b = -1, l = c.width, r = -1;
      for (let y = 0; y < c.height; y++) for (let xx = 0; xx < c.width; xx++) {
        const i = (y * c.width + xx) * 4, a = d[i + 3];
        if (a < 250) alpha = true;
        if (a > 16 && !(d[i] > 238 && d[i + 1] > 238 && d[i + 2] > 238)) { if (y < t) t = y; if (y > b) b = y; if (xx < l) l = xx; if (xx > r) r = xx; }
      }
      if (b < 0) { t = 0; l = 0; b = c.height - 1; r = c.width - 1; }
      const pad = Math.round(Math.max(r - l, b - t) * 0.02);
      l = Math.max(0, l - pad); t = Math.max(0, t - pad); r = Math.min(c.width - 1, r + pad); b = Math.min(c.height - 1, b + pad);
      const w = r - l + 1, h = b - t + 1, s1 = Math.min(1, 480 / w, 200 / h);
      const o = document.createElement('canvas'); o.width = Math.max(1, Math.round(w * s1)); o.height = Math.max(1, Math.round(h * s1));
      const ox = o.getContext('2d');
      if (!alpha) { ox.fillStyle = '#fff'; ox.fillRect(0, 0, o.width, o.height); }
      ox.imageSmoothingQuality = 'high'; ox.drawImage(c, l, t, w, h, 0, 0, o.width, o.height);
      res(alpha ? o.toDataURL('image/png') : o.toDataURL('image/jpeg', 0.88));
    };
    im.src = url;
  });
}

async function act(id, a) {
  const i = W.items.indexOf(id), q = qOf(id);
  const same = W.items.map((x, j) => j).filter(j => bucketOf(qOf(W.items[j])) === bucketOf(q));
  if (a === 'del') W.items.splice(i, 1);
  if (a === 'up' || a === 'down') {
    const k = same.indexOf(i), j = same[a === 'up' ? k - 1 : k + 1];
    if (j === undefined) return;
    [W.items[i], W.items[j]] = [W.items[j], W.items[i]];
  }
  if (a === 'swap') {
    if (q.page) return;
    const taken = new Set([...W.items, ...(W.avoid ? usedIds() : [])]);
    let c = pool().filter(x => bucketOf(x) === bucketOf(q) && !taken.has(x.id));
    const sameD = c.filter(x => diffIx(x) === diffIx(q)), sameCh = sameD.filter(x => x.chapter_id === q.chapter_id);
    c = sameCh.length ? sameCh : sameD.length ? sameD : c;
    if (!c.length) return toast('No other question of this type matches your settings.');
    W.items[i] = c[Math.floor(Math.random() * c.length)].id;
  }
  if (!W.items.length) return form();
  await sheet();
  if (a !== 'del') { const el = app.querySelector(`.q[data-id="${CSS.escape(W.items[a === 'swap' ? i : W.items.indexOf(id)])}"]`); if (el) el.scrollIntoView({ block: 'center' }); }
}
async function more() {
  if (W.items.length >= (K.pro() ? PRO_MAX : FREE_MAX)) return toast(K.pro() ? `Up to ${PRO_MAX} questions per sheet.` : `Free plan: up to ${FREE_MAX} questions per sheet.`);
  const taken = new Set([...W.items, ...(W.avoid ? usedIds() : [])]);
  let c = pool().filter(x => !taken.has(x.id));
  /* nothing left in the ticked sources (e.g. a sheet of my own questions): take a PYQ of the same exam */
  if (!c.length) c = META.filter(x => x.track === W.track && srcOf(x) === (W.track === 'main' ? 'main' : 'adv') && !taken.has(x.id) && (!W.chapters.length || inChaps(x, W.chapters)));
  if (!c.length) return toast('No more questions match your settings.');
  const counts = {}; W.items.forEach(id => { const b = bucketOf(qOf(id)); counts[b] = (counts[b] || 0) + 1; });
  const b = Object.keys(counts).sort((x, y) => counts[x] - counts[y]).find(b => c.some(q => bucketOf(q) === b)) || bucketOf(c[0]);
  const list = c.filter(q => bucketOf(q) === b);
  W.items.push(list[Math.floor(Math.random() * list.length)].id);
  await sheet();
  window.scrollTo(0, document.body.scrollHeight);
}

/* ---------------- the printed sheet ---------------- */
function setOrder(k) {
  if (k === 0) return W.items.slice();
  const r = K.rng((W.id || W.title) + '|set' + k);
  return sections(W.items).flatMap(s => K.shuffle(s.ids, r));

function insLine(s) {
  if (s.b === 'page') return '';
  if (s.b === 'subj') return `<li><b>Subjective:</b> write the full working; marks are shown against each question.</li>`;
  if (track() === 'main') return `<li><b>${s.name}:</b> +4 for a correct answer, −1 for a wrong one, 0 if left blank.</li>`;
  if (s.b === 'sc') return `<li><b>Single correct:</b> only one option is correct. +3 if correct, −1 if wrong, 0 if left blank.</li>`;
  if (s.b === 'mc') return `<li><b>Multiple correct:</b> one or more options are correct. +4 if all correct options and no wrong option are chosen; +1 for each correct option chosen when no wrong option is chosen; −2 if any wrong option is chosen.</li>`;
  if (s.b === 'num') return `<li><b>Numerical:</b> the answer is a number. +4 if correct, 0 otherwise.</li>`;
  return `<li><b>Matching:</b> +3 if correct, −1 if wrong${s.ids.some(id => K.kind(qOf(id)) === 'grid') ? '; tick-grid questions: +2 for each fully correct row' : ''}.</li>`;
}
function markTxt(s) {

  if (s.b === 'subj') return 'marks as shown';
  if (s.b === 'mc') return `+${s.plus} / ${s.minus} · partial marks`;

function dateTxt() { try { return W.date ? new Date(W.date + 'T00:00').toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : ''; } catch (e) { return ''; } }
/* Options: 4 across when they are short, 2 across for medium, one per line otherwise. */
function optsHtml(q) {

  }
  if (!Array.isArray(q.options) || !q.options.length) {
    return k === 'num' && W.answerBoxes ? '<div class="ansbox">Answer <i></i></div>' : '';
  }
  const html = q.options.map(o => (typeof o === 'string' ? o : (o.html || '')));
  const block = html.some(h => /<(table|img|svg|div|p)\b|\\\[|\$\$|\\begin/.test(h));
  return `<ol class="opts c1${block ? ' fixed' : ''}">${html.map((h, j) => `<li><span class="ol">(${K.optLabel(q, j)})</span><span>${h}</span></li>`).join('')}</ol>`;

async function solsHtml() {
  const bankIds = W.items.filter(id => !/^(MY|INK)-/.test(id));
  const sol = Object.fromEntries((bankIds.length ? await K.fetchIn('solutions', 'question_id,key_idea,full_html,alt_html', 'question_id', bankIds) : []).map(s => [s.question_id, s]));
  W.items.filter(id => /^MY-/.test(id) && qOf(id).sol_html).forEach(id => { sol[id] = { full_html: qOf(id).sol_html }; });
  return `<section class="set">${masthead('Solutions', '')}<div class="title">${esc(W.title)}${W.sets > 1 ? ' · in Set A order' : ''}</div>
    ${W.items.filter(isQ).map((id, i) => { const s = sol[id], q = qOf(id); return `<div class="sol"><div class="hd"><span class="pq" style="margin:0"><span class="n">${i + 1}</span></span><span class="chip">Answer ${esc(K.keyText(q))}</span></div>
      ${s ? `${s.key_idea ? `<div class="lb">Key idea</div><div>${s.key_idea}</div>` : ''}${s.full_html ? `<div class="lb">Solution</div><div>${s.full_html}</div>` : ''}${s.alt_html ? `<div class="lb">Another way</div><div>${s.alt_html}</div>` : ''}` : '<div><i>No written solution for this question yet.</i></div>'}</div>`; }).join('')}</section>`;
}
/* Page footer and numbers go in the page margins (Chrome / Edge print them on every page). */
function pageStyle() {
  const foot = K.pro() ? [W.inst, W.teacher].filter(Boolean).join(' · ') : 'Made with Mathemission Teach · teach.mathemission.in';
  const css = s => '"' + String(s).replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\n/g, ' ') + '"';
  document.getElementById('pagestyle').textContent = `@media print{@page{
    @bottom-left{content:${css(foot)};font:8pt Inter,sans-serif;color:#6b7799}
    @bottom-right{content:"Page " counter(page) " of " counter(pages);font:8pt Inter,sans-serif;color:#6b7799}}}`;
}
async function buildSheet() {
  const el = document.getElementById('sheet');
  let h = '';
  for (let k = 0; k < W.sets; k++) h += setHtml(k);
  if (W.key) h += keyHtml();
  if (W.sols && K.pro()) h += await solsHtml();
  el.innerHTML = h;
  pageStyle();
  return el;
}
/* Options: measured after the maths is drawn. 4 across if every option fits a quarter of the line,
   2 across if it fits half, otherwise one per line. */
function layoutOpts(el) {
  el.querySelectorAll('ol.opts:not(.fixed)').forEach(ol => {
    ol.className = 'opts c1';
    const room = ol.clientWidth, gap = 6 * 3.78;
    const w = Math.max(...[...ol.querySelectorAll('li')].map(li => {
      const r = document.createRange(); r.selectNodeContents(li.lastElementChild);
      return li.firstElementChild.getBoundingClientRect().width + r.getBoundingClientRect().width;
    }));
    ol.className = 'opts ' + (w <= (room - 3 * gap) / 4 ? 'c4' : w <= (room - gap) / 2 ? 'c2' : 'c1');
  });
}
/* Maths wider than its column is scaled down to fit (MathJax doesn't break lines). */
function fitMaths(el) {
  el.querySelectorAll('mjx-container').forEach(m => {
    m.style.zoom = '';
    const box = m.parentElement.closest('.b,.sol,.stem,li,div');
    const room = box ? box.clientWidth : 0, w = m.getBoundingClientRect().width;
    if (room && w > room + 1) m.style.zoom = Math.max(0.55, (room - 2) / w).toFixed(3);
  });
}
async function preview() {
  const b = app.querySelector('#pvbtn'); b.disabled = true; b.textContent = 'Preparing…';
  try {
    const el = await buildSheet();
    let pv = document.getElementById('pvwrap');
    if (!pv) { pv = document.createElement('div'); pv.id = 'pvwrap'; document.body.appendChild(pv); }
    pv.innerHTML = `<div class="pbar"><span>Preview · ${W.items.filter(isQ).length} questions${W.sets > 1 ? ` · ${W.sets} sets` : ''}${W.key ? ' · answer key' : ''}${W.sols && K.pro() ? ' · solutions' : ''}</span>
      <button class="btn" id="pvPrint">Print / save as PDF</button><button class="btn ghost" id="pvClose">Close</button></div>`;
    pv.appendChild(el);
    document.body.style.overflow = 'hidden';
    await Promise.all([typeset(el), document.fonts ? document.fonts.ready : null]);
    await Promise.all([...el.querySelectorAll('img')].map(i => (i.complete ? null : new Promise(r => { i.onload = i.onerror = r; }))));
    layoutOpts(el);
    fitMaths(el);
    const close = () => { document.body.style.overflow = ''; document.body.appendChild(el); el.innerHTML = ''; pv.remove(); };
    pv.querySelector('#pvClose').onclick = close;
    pv.querySelector('#pvPrint').onclick = () => {
      document.title = W.title.replace(/[\\/:*?"<>|]/g, '-');
      window.print();
      document.title = 'Worksheet Builder · Mathemission Teach';
    };
  } catch (e) { toast('Couldn’t prepare the sheet: ' + e.message); }
  b.disabled = false; b.textContent = 'Preview & print';
}
})();
